services:
  apache:
    build:
      context: .
    container_name: ${domain}
    volumes:
      - /php-sites/${domain}/root:/app/
    env_file:
      - etc/environment.yml
      # - etc/environment.development.yml
      - etc/environment.production.yml
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    networks:
      - local
      - www

  mariadb:
    image: mariadb:latest
    container_name: ${domain}-db
    env_file:
      - /php-sites/${domain}/.env
    volumes:
      - /php-sites/${domain}/mariadb:/var/lib/mysql
    restart: always
    networks:
      - local
      - database-monitor

  backup-runner:
    container_name: ${domain}-backup-runner
    build:
      context: .
      dockerfile: ./Dockerfile-backup
    volumes:
      - /php-sites/${domain}:/source:ro
      - /php-sites/${domain}/backup:/backup
    env_file:
      - /php-sites/${domain}/.env
    deploy:
      resources:
        limits:
          memory: 256MB
          cpus: '0.5'

networks:
  local:
    name: ${domain}
  www:
    name: www
    external: true
  database-monitor:
    name: database-monitor
    external: true
